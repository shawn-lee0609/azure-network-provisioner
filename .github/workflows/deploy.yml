name: Deploy Pipeline

on:
  # workflow_dispatch: -> Manual trigger only - prevents accidental deployments on every push
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev / staging / prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  # Job 1: Deploy Azure Network Infrastructure
  deploy-infrastructure:
    name: Deploy Network Infrastructure
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Az PowerShell module
        shell: pwsh
        run: Install-Module -Name Az -Scope CurrentUser -Force -AllowClobber

      - name: Run Deploy-All.ps1 (dry run)
        shell: pwsh
        run: |
          # NOTE: Azure login via Service Principal requires Entra ID permissions
          # which are restricted on Azure for Students subscriptions.
          # In a production environment, this step would use:
          # azure/login@v2 with AZURE_CREDENTIALS secret (Service Principal)
          # For local execution, run: .\deploy\Deploy-All.ps1 -Environment dev
          Write-Host "Deploy pipeline configured for environment: ${{ github.event.inputs.environment }}"
          Write-Host "To deploy locally: .\deploy\Deploy-All.ps1 -Environment ${{ github.event.inputs.environment }}"

  # Job 2: Validate Deployed Infrastructure
  validate-infrastructure:
    name: Validate Infrastructure
    # Since validation uses only Python, better to use ubuntu (Faster and lighter)
    runs-on: ubuntu-latest
    # Only run validation after deployment succeeds
    needs: deploy-infrastructure
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install -r validate/requirements.txt
      
      - name: Run validator (dry run)
        run: |
          # NOTE: Requires AZURE_SUBSCRIPTION_ID and Azure credentials via GitHub Secrets
          # In a production environment, AZURE_CREDENTIALS Secret (Service Principal) would be used
          # For local execution, run: python validate/validator.py
          echo "Validation pipeline configured."
          echo "To validate locally: python validate/validator.py"

      - name: Generate HTML report (dry run)
        run: |
          # For local execution, run: python validate/report_generator.py
          echo "Report generation configured."
          echo "To generate locally: python validate/report_generator.py"

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validate/report.html
          # Saves report.html as a downloadable artifact in GitHub Actions